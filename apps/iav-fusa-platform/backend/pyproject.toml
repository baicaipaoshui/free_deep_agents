[project]
name = "iav-fusa-platform-backend"
version = "1.0.0"
description = "IAV AI Safety Platform — FuSa multi-agent backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "websockets>=13.0,<17.0",
    # DeepAgents SDK (local development)
    "deepagents",
    # LangChain / LangGraph
    "langgraph>=1.1.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "langchain>=0.3.0",
    "langchain-core>=1.2.21",
    "langchain-anthropic>=0.3.0",
    # HTTP client for Dify API
    "httpx[socks]>=0.27.0,<1.0.0",
    # Data validation
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    # Cache / message queue
    "redis[hiredis]>=5.0.0,<6.0.0",
    # Object storage
    "minio>=7.2.0,<8.0.0",
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",    # for TestClient
    "ruff>=0.4.0",
]

[tool.uv.sources]
deepagents = { path = "../../../libs/deepagents", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
