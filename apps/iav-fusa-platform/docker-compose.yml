version: "3.9"

services:
  # ──────────────────────────── 基础设施 ────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fusa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ──────────────────────────── Dify RAG ────────────────────────────
  dify-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dify
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: dify_password
    volumes:
      - dify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  dify-redis:
    image: redis:7-alpine
    volumes:
      - dify_redis_data:/data

  dify:
    image: langgenius/dify-api:latest
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
    environment:
      MODE: api
      DB_USERNAME: dify
      DB_PASSWORD: dify_password
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      SECRET_KEY: your-secret-key-change-in-production
      STORAGE_TYPE: local
    volumes:
      - dify_storage:/app/api/storage
    ports:
      - "5001:5001"

  dify-worker:
    image: langgenius/dify-api:latest
    depends_on:
      - dify-db
      - dify-redis
    environment:
      MODE: worker
      DB_USERNAME: dify
      DB_PASSWORD: dify_password
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      SECRET_KEY: your-secret-key-change-in-production
      STORAGE_TYPE: local
    volumes:
      - dify_storage:/app/api/storage

  dify-web:
    image: langgenius/dify-web:latest
    environment:
      CONSOLE_API_URL: http://localhost:5001
      APP_API_URL: http://localhost:5001
    ports:
      - "3001:3000"

  # ──────────────────────────── Backend ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fusa
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      DIFY_API_URL: http://dify:5001
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────── Frontend ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dify_db_data:
  dify_redis_data:
  dify_storage:
